name: Compilar APK Infinix Definitivo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generar Proyecto Android con Motor Nativo Real
        shell: python3 {0}
        run: |
          import pathlib

          def write_file(path, text):
              p = pathlib.Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              lines = [l[10:] if l.startswith("          ") else l for l in text.splitlines()]
              p.write_text("\n".join(lines).strip() + "\n", encoding="utf-8")

          write_file("gradle.properties", """
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          """)

          write_file("settings.gradle.kts", """
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "InfinixRetroEmu"
          include(":app")
          """)

          write_file("build.gradle.kts", """
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          """)

          write_file("app/build.gradle.kts", """
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.infinix.retroemu"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.infinix.retroemu"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0-InfinixEdition"

                  ndk {
                      abiFilters.add("arm64-v8a")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.02.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
              implementation("androidx.documentfile:documentfile:1.0.1")
          }
          """)

          write_file("app/src/main/AndroidManifest.xml", """
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-feature android:name="android.hardware.gamepad" android:required="false" />
              <uses-feature android:glEsVersion="0x00030002" android:required="true" />

              <application
                  android:allowBackup="true"
                  android:label="Infinix RetroEmu"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """)

          write_file("app/src/main/cpp/CMakeLists.txt", """
          cmake_minimum_required(VERSION 3.22.1)
          project("infinix_retro_engine")
          find_library(log-lib log)
          find_library(android-lib android)
          add_library(retro_engine SHARED native_bridge.cpp)
          target_link_libraries(retro_engine ${log-lib} ${android-lib} dl)
          """)

          write_file("app/src/main/cpp/native_bridge.cpp", """
          #include <jni.h>
          #include <string>
          #include <dlfcn.h>
          #include <android/log.h>
          #include <vector>
          #include <atomic>

          #define LOG_TAG "InfinixEngine"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)
          #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, LOG_TAG, __VA_ARGS__)

          typedef void (*retro_init_t)(void);
          typedef void (*retro_run_t)(void);
          typedef bool (*retro_load_game_t)(const struct retro_game_info*);

          struct retro_game_info {
              const void *path;
              const void *data;
              size_t size;
              const char *meta;
          };

          struct CoreHandle {
              void* handle = nullptr;
              retro_init_t init = nullptr;
              retro_run_t run = nullptr;
              retro_load_game_t load_game = nullptr;
          } active_core;

          std::atomic<uint16_t> current_bitmask{0};

          extern "C" {
          JNIEXPORT jboolean JNICALL
          Java_com_infinix_retroemu_core_LibretroWrapper_loadCoreAndGame(
                  JNIEnv* env, jobject, jstring corePath, jstring romPath) {
              const char* core_c = env->GetStringUTFChars(corePath, nullptr);
              const char* rom_c = env->GetStringUTFChars(romPath, nullptr);

              active_core.handle = dlopen(core_c, RTLD_LAZY);
              if (!active_core.handle) {
                  LOGE("Error abriendo core: %s", dlerror());
                  env->ReleaseStringUTFChars(corePath, core_c);
                  env->ReleaseStringUTFChars(romPath, rom_c);
                  return JNI_FALSE;
              }

              active_core.init = (retro_init_t)dlsym(active_core.handle, "retro_init");
              active_core.run = (retro_run_t)dlsym(active_core.handle, "retro_run");
              active_core.load_game = (retro_load_game_t)dlsym(active_core.handle, "retro_load_game");

              if (active_core.init) active_core.init();

              if (active_core.load_game) {
                  retro_game_info info = { rom_c, nullptr, 0, "" };
                  if (!active_core.load_game(&info)) {
                      LOGE("El core rechazo la ROM");
                  }
              }

              env->ReleaseStringUTFChars(corePath, core_c);
              env->ReleaseStringUTFChars(romPath, rom_c);
              return JNI_TRUE;
          }

          JNIEXPORT void JNICALL
          Java_com_infinix_retroemu_core_LibretroWrapper_updateInputBitmask(JNIEnv*, jobject, jint mask) {
              current_bitmask.store(static_cast<uint16_t>(mask), std::memory_order_relaxed);
          }

          JNIEXPORT void JNICALL
          Java_com_infinix_retroemu_core_LibretroWrapper_stepFrame(JNIEnv*, jobject, jboolean, jint) {
              if (active_core.run) {
                  active_core.run();
              }
          }

          JNIEXPORT void JNICALL
          Java_com_infinix_retroemu_core_LibretroWrapper_setShaderFilter(JNIEnv*, jobject, jint) {}
          }
          """)

          write_file("app/src/main/java/com/infinix/retroemu/core/LibretroWrapper.kt", """
          package com.infinix.retroemu.core

          object LibretroWrapper {
              init { System.loadLibrary("retro_engine") }
              external fun loadCoreAndGame(corePath: String, romPath: String): Boolean
              external fun updateInputBitmask(bitmask: Int)
              external fun stepFrame(isRewinding: Boolean, speedMultiplier: Int)
              external fun setShaderFilter(filterType: Int)

              const val BTN_B      = 1 shl 0
              const val BTN_Y      = 1 shl 1
              const val BTN_SELECT = 1 shl 2
              const val BTN_START  = 1 shl 3
              const val BTN_UP     = 1 shl 4
              const val BTN_DOWN   = 1 shl 5
              const val BTN_LEFT   = 1 shl 6
              const val BTN_RIGHT  = 1 shl 7
              const val BTN_A      = 1 shl 8
              const val BTN_L      = 1 shl 10
              const val BTN_R      = 1 shl 11
          }
          """)

          write_file("app/src/main/java/com/infinix/retroemu/data/RomScanner.kt", """
          package com.infinix.retroemu.data

          import android.content.Context
          import android.net.Uri
          import androidx.documentfile.provider.DocumentFile
          import com.infinix.retroemu.ui.ConsoleSystem
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.io.FileOutputStream
          import java.util.zip.ZipInputStream

          data class RomItem(
              val id: String,
              val title: String,
              val fileUri: Uri,
              val system: ConsoleSystem,
              val isZipped: Boolean,
              val internalEntryName: String? = null
          )

          class RomScanner(private val context: Context) {
              suspend fun scanDirectory(directoryUri: Uri): List<RomItem> = withContext(Dispatchers.IO) {
                  val foundRoms = mutableListOf<RomItem>()
                  val rootDoc = DocumentFile.fromTreeUri(context, directoryUri) ?: return@withContext emptyList()
                  rootDoc.listFiles().forEach { file ->
                      val fileName = file.name ?: return@forEach
                      when (fileName.substringAfterLast('.', "").lowercase()) {
                          "nes" -> foundRoms.add(createRomItem(file, ConsoleSystem.NES, false))
                          "gb", "gbc" -> foundRoms.add(createRomItem(file, ConsoleSystem.GB_GBC, false))
                          "gba" -> foundRoms.add(createRomItem(file, ConsoleSystem.GBA, false))
                          "zip" -> inspectZipFile(file)?.let { foundRoms.add(it) }
                      }
                  }
                  foundRoms.sortedBy { it.title }
              }

              private fun inspectZipFile(zipFile: DocumentFile): RomItem? {
                  return try {
                      context.contentResolver.openInputStream(zipFile.uri)?.use { input ->
                          ZipInputStream(input).use { zis ->
                              var entry = zis.nextEntry
                              while (entry != null) {
                                  if (!entry.isDirectory) {
                                      val sys = when (entry.name.substringAfterLast('.', "").lowercase()) {
                                          "nes" -> ConsoleSystem.NES
                                          "gb", "gbc" -> ConsoleSystem.GB_GBC
                                          "gba" -> ConsoleSystem.GBA
                                          else -> null
                                      }
                                      if (sys != null) return createRomItem(zipFile, sys, true, entry.name)
                                  }
                                  entry = zis.nextEntry
                              }
                          }
                      }
                      null
                  } catch (e: Exception) { null }
              }

              suspend fun prepareRomForExecution(rom: RomItem): String = withContext(Dispatchers.IO) {
                  val cacheFile = File(context.cacheDir, "active_rom_" + rom.system.name + ".bin")
                  context.contentResolver.openInputStream(rom.fileUri)?.use { input ->
                      FileOutputStream(cacheFile).use { output ->
                          if (rom.isZipped) {
                              ZipInputStream(input).use { zis ->
                                  var entry = zis.nextEntry
                                  while (entry != null) {
                                      if (entry.name == rom.internalEntryName) {
                                          zis.copyTo(output)
                                          break
                                      }
                                      entry = zis.nextEntry
                                  }
                              }
                          } else { input.copyTo(output) }
                      }
                  }
                  cacheFile.absolutePath
              }

              private fun createRomItem(file: DocumentFile, system: ConsoleSystem, isZipped: Boolean, entryName: String? = null): RomItem {
                  val cleanTitle = (file.name ?: "Juego").substringBeforeLast('.').trim()
                  return RomItem(file.uri.toString(), cleanTitle, file.uri, system, isZipped, entryName)
              }
          }
          """)

          write_file("app/src/main/java/com/infinix/retroemu/ui/EmulatorScreen.kt", """
          package com.infinix.retroemu.ui

          import android.view.HapticFeedbackConstants
          import android.view.SurfaceView
          import androidx.compose.foundation.background
          import androidx.compose.foundation.gestures.detectTapGestures
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.alpha
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.platform.LocalView
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView
          import com.infinix.retroemu.core.LibretroWrapper

          enum class ConsoleSystem(val baseWidth: Int, val baseHeight: Int, val title: String) {
              NES(256, 240, "Nintendo NES"),
              GB_GBC(160, 144, "Game Boy / Color"),
              GBA(240, 160, "Game Boy Advance")
          }

          enum class VisualFilter(val id: Int, val label: String) {
              PIXEL_PERFECT(0, "Pixel Nitido"),
              CRT_CURVED(1, "CRT Clasico"),
              LCD_GRID(2, "Matriz LCD")
          }

          @Composable
          fun EmulatorScreen(system: ConsoleSystem, romTitle: String) {
              val localView = LocalView.current
              val density = LocalDensity.current.density
              val isFastForward = remember { mutableStateOf(false) }
              val isRewinding = remember { mutableStateOf(false) }
              val currentFilter = remember { mutableStateOf(VisualFilter.PIXEL_PERFECT) }
              val activeBitmask = remember { mutableStateOf(0) }

              val screenWidthPx = 2644
              val screenHeightPx = 1208
              val scaleFactor = remember(system) { minOf(screenWidthPx / system.baseWidth, screenHeightPx / system.baseHeight) }
              val viewportWidthDp = ((system.baseWidth * scaleFactor) / density).dp
              val viewportHeightDp = ((system.baseHeight * scaleFactor) / density).dp
              val bezelWidthDp = (((screenWidthPx - (system.baseWidth * scaleFactor)) / 2) / density).dp

              fun updateButtonState(buttonMask: Int, isPressed: Boolean) {
                  if (isPressed) {
                      localView.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                      activeBitmask.value = activeBitmask.value or buttonMask
                  } else {
                      activeBitmask.value = activeBitmask.value and buttonMask.inv()
                  }
                  LibretroWrapper.updateInputBitmask(activeBitmask.value)
              }

              Row(
                  modifier = Modifier.fillMaxSize().background(Color(0xFF121214)),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.SpaceBetween
              ) {
                  Box(modifier = Modifier.width(bezelWidthDp).fillMaxHeight().padding(16.dp).alpha(0.85f)) {
                      Row(modifier = Modifier.align(Alignment.TopStart), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          if (system == ConsoleSystem.GBA) ShoulderButton("L") { updateButtonState(LibretroWrapper.BTN_L, it) }
                          QoLChipButton("Rewind", isRewinding.value) { isRewinding.value = it; LibretroWrapper.stepFrame(it, 1) }
                      }
                      DPadControl(Modifier.align(Alignment.Center)) { mask, pressed -> updateButtonState(mask, pressed) }
                      PillButton("SELECT", Modifier.align(Alignment.BottomEnd)) { updateButtonState(LibretroWrapper.BTN_SELECT, it) }
                  }

                  Box(modifier = Modifier.size(viewportWidthDp, viewportHeightDp).background(Color.Black), contentAlignment = Alignment.Center) {
                      AndroidView(factory = { ctx -> SurfaceView(ctx).apply { holder.setFixedSize(system.baseWidth, system.baseHeight) } }, modifier = Modifier.fillMaxSize())
                  }

                  Box(modifier = Modifier.width(bezelWidthDp).fillMaxHeight().padding(16.dp).alpha(0.85f)) {
                      Row(modifier = Modifier.align(Alignment.TopEnd), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          FilledTonalButton(
                              onClick = {
                                  val entries = VisualFilter.values()
                                  currentFilter.value = entries[(currentFilter.value.ordinal + 1) % entries.size]
                                  LibretroWrapper.setShaderFilter(currentFilter.value.id)
                              },
                              contentPadding = PaddingValues(horizontal = 10.dp, vertical = 4.dp)
                          ) { Text(currentFilter.value.label, fontSize = 11.sp) }
                          QoLChipButton(if (isFastForward.value) "4x ON" else "1x", isFastForward.value) {
                              isFastForward.value = !isFastForward.value
                              LibretroWrapper.stepFrame(false, if (isFastForward.value) 4 else 1)
                          }
                          if (system == ConsoleSystem.GBA) ShoulderButton("R") { updateButtonState(LibretroWrapper.BTN_R, it) }
                      }
                      Box(modifier = Modifier.align(Alignment.Center).size(160.dp, 100.dp)) {
                          ActionButton("B", Color(0xFFB71C1C), Modifier.align(Alignment.BottomStart)) { updateButtonState(LibretroWrapper.BTN_B, it) }
                          ActionButton("A", Color(0xFFD32F2F), Modifier.align(Alignment.TopEnd)) { updateButtonState(LibretroWrapper.BTN_A, it) }
                      }
                      PillButton("START", Modifier.align(Alignment.BottomStart)) { updateButtonState(LibretroWrapper.BTN_START, it) }
                  }
              }
          }

          @Composable
          fun ActionButton(label: String, color: Color, modifier: Modifier = Modifier, onPressChange: (Boolean) -> Unit) {
              Box(modifier = modifier.size(68.dp).background(color, CircleShape).pointerInput(Unit) {
                  detectTapGestures(onPress = { onPressChange(true); tryAwaitRelease(); onPressChange(false) })
              }, contentAlignment = Alignment.Center) { Text(label, color = Color.White, fontWeight = FontWeight.Bold, fontSize = 22.sp) }
          }

          @Composable
          fun PillButton(label: String, modifier: Modifier = Modifier, onPressChange: (Boolean) -> Unit) {
              Box(modifier = modifier.width(76.dp).height(28.dp).background(Color.DarkGray, RoundedCornerShape(50)).pointerInput(Unit) {
                  detectTapGestures(onPress = { onPressChange(true); tryAwaitRelease(); onPressChange(false) })
              }, contentAlignment = Alignment.Center) { Text(label, color = Color.LightGray, fontWeight = FontWeight.SemiBold, fontSize = 11.sp) }
          }

          @Composable
          fun ShoulderButton(label: String, onPressChange: (Boolean) -> Unit) {
              Box(modifier = Modifier.width(64.dp).height(36.dp).background(Color(0xFF2C2C30), RoundedCornerShape(8.dp)).pointerInput(Unit) {
                  detectTapGestures(onPress = { onPressChange(true); tryAwaitRelease(); onPressChange(false) })
              }, contentAlignment = Alignment.Center) { Text(label, color = Color.White, fontWeight = FontWeight.Bold) }
          }

          @Composable
          fun QoLChipButton(label: String, isActive: Boolean, onToggle: (Boolean) -> Unit) {
              Surface(color = if (isActive) Color(0xFF00C853) else Color(0xFF2C2C30), shape = RoundedCornerShape(8.dp), modifier = Modifier.pointerInput(Unit) {
                  detectTapGestures(onPress = { onToggle(true); tryAwaitRelease(); onToggle(false) })
              }) { Text(label, color = Color.White, fontSize = 11.sp, fontWeight = FontWeight.Medium, modifier = Modifier.padding(horizontal = 10.dp, vertical = 8.dp)) }
          }

          @Composable
          fun DPadControl(modifier: Modifier = Modifier, onDirectionChange: (Int, Boolean) -> Unit) {
              Box(modifier = modifier.size(150.dp)) {
                  DPadSegment("▲", Modifier.align(Alignment.TopCenter).size(50.dp, 55.dp)) { onDirectionChange(LibretroWrapper.BTN_UP, it) }
                  DPadSegment("▼", Modifier.align(Alignment.BottomCenter).size(50.dp, 55.dp)) { onDirectionChange(LibretroWrapper.BTN_DOWN, it) }
                  DPadSegment("◀", Modifier.align(Alignment.CenterStart).size(55.dp, 50.dp)) { onDirectionChange(LibretroWrapper.BTN_LEFT, it) }
                  DPadSegment("▶", Modifier.align(Alignment.CenterEnd).size(55.dp, 50.dp)) { onDirectionChange(LibretroWrapper.BTN_RIGHT, it) }
              }
          }

          @Composable
          fun DPadSegment(label: String, modifier: Modifier, onPress: (Boolean) -> Unit) {
              Box(modifier = modifier.background(Color(0xFF2A2A2E), RoundedCornerShape(6.dp)).pointerInput(Unit) {
                  detectTapGestures(onPress = { onPress(true); tryAwaitRelease(); onPress(false) })
              }, contentAlignment = Alignment.Center) { Text(label, color = Color.Gray, fontSize = 16.sp) }
          }
          """)

          write_file("app/src/main/java/com/infinix/retroemu/ui/LibraryScreen.kt", """
          package com.infinix.retroemu.ui

          import android.net.Uri
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.grid.GridCells
          import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
          import androidx.compose.foundation.lazy.grid.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.infinix.retroemu.data.RomItem

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun LibraryScreen(
              roms: List<RomItem>,
              lastPlayedRom: RomItem?,
              onSelectFolder: (Uri) -> Unit,
              onLaunchGame: (RomItem, Boolean) -> Unit
          ) {
              val selectedTab = remember { mutableStateOf(0) }
              val tabs = listOf("Todos", "NES", "Game Boy / GBC", "GBA")
              val folderPickerLauncher = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocumentTree()) { uri -> uri?.let { onSelectFolder(it) } }
              val filteredRoms = remember(roms, selectedTab.value) {
                  when (selectedTab.value) {
                      1 -> roms.filter { it.system == ConsoleSystem.NES }
                      2 -> roms.filter { it.system == ConsoleSystem.GB_GBC }
                      3 -> roms.filter { it.system == ConsoleSystem.GBA }
                      else -> roms
                  }
              }

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = {
                              Column {
                                  Text("Infinix RetroEmu", fontWeight = FontWeight.ExtraBold, fontSize = 20.sp)
                                  Text("Snapdragon 7s Gen 4 • Sin Anuncios", fontSize = 11.sp, color = Color(0xFF00E676))
                              }
                          },
                          actions = {
                              FilledTonalButton(onClick = { folderPickerLauncher.launch(null) }, modifier = Modifier.padding(end = 12.dp)) { Text("Carpeta") }
                          },
                          colors = TopAppBarDefaults.topAppBarColors(containerColor = Color(0xFF121214), titleContentColor = Color.White)
                      )
                  },
                  containerColor = Color(0xFF0A0A0C)
              ) { paddingValues ->
                  Column(modifier = Modifier.fillMaxSize().padding(paddingValues)) {
                      if (lastPlayedRom != null) {
                          Card(
                              modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 8.dp).clickable { onLaunchGame(lastPlayedRom, true) },
                              shape = RoundedCornerShape(16.dp),
                              colors = CardDefaults.cardColors(containerColor = Color(0xFF1E1E24))
                          ) {
                              Row(modifier = Modifier.fillMaxWidth().padding(16.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) {
                                  Column(modifier = Modifier.weight(1f)) {
                                      Text("CONTINUAR PARTIDA", color = Color(0xFF00E676), fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                      Text(lastPlayedRom.title, color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                  }
                                  Button(onClick = { onLaunchGame(lastPlayedRom, true) }, colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF00C853))) {
                                      Text("Jugar", color = Color.Black, fontWeight = FontWeight.Bold)
                                  }
                              }
                          }
                      }
                      ScrollableTabRow(selectedTabIndex = selectedTab.value, containerColor = Color(0xFF121214), contentColor = Color.White, edgePadding = 16.dp) {
                          tabs.forEachIndexed { idx, title ->
                              Tab(selected = selectedTab.value == idx, onClick = { selectedTab.value = idx }, text = { Text(title) })
                          }
                      }
                      if (filteredRoms.isEmpty()) {
                          Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                              Button(onClick = { folderPickerLauncher.launch(null) }) { Text("Elegir Carpeta de Juegos (.nes, .gb, .gba, .zip)") }
                          }
                      } else {
                          LazyVerticalGrid(columns = GridCells.Adaptive(minSize = 150.dp), contentPadding = PaddingValues(16.dp), horizontalArrangement = Arrangement.spacedBy(12.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                              items(filteredRoms, key = { it.id }) { rom -> RomCard(rom) { onLaunchGame(rom, false) } }
                          }
                      }
                  }
              }
          }

          @Composable
          fun RomCard(rom: RomItem, onClick: () -> Unit) {
              val badgeColor = when (rom.system) {
                  ConsoleSystem.NES -> Color(0xFFE53935)
                  ConsoleSystem.GB_GBC -> Color(0xFF8E24AA)
                  ConsoleSystem.GBA -> Color(0xFF3949AB)
              }
              Box(modifier = Modifier.fillMaxWidth().height(130.dp).clip(RoundedCornerShape(14.dp)).background(Brush.verticalGradient(listOf(badgeColor.copy(alpha = 0.35f), Color(0xFF1A1A20)))).clickable { onClick() }.padding(12.dp)) {
                  Surface(color = badgeColor, shape = RoundedCornerShape(6.dp), modifier = Modifier.align(Alignment.TopStart)) {
                      Text(rom.system.name.replace("_", "/"), color = Color.White, fontSize = 10.sp, fontWeight = FontWeight.Bold, modifier = Modifier.padding(horizontal = 6.dp, vertical = 2.dp))
                  }
                  Text(rom.title, color = Color.White, fontWeight = FontWeight.SemiBold, fontSize = 14.sp, maxLines = 2, overflow = TextOverflow.Ellipsis, modifier = Modifier.align(Alignment.BottomStart))
              }
          }
          """)

          write_file("app/src/main/java/com/infinix/retroemu/MainActivity.kt", """
          package com.infinix.retroemu

          import android.content.Context
          import android.content.Intent
          import android.content.pm.ActivityInfo
          import android.net.Uri
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.setContent
          import androidx.compose.runtime.*
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import androidx.lifecycle.lifecycleScope
          import com.infinix.retroemu.core.LibretroWrapper
          import com.infinix.retroemu.data.RomItem
          import com.infinix.retroemu.data.RomScanner
          import com.infinix.retroemu.ui.ConsoleSystem
          import com.infinix.retroemu.ui.EmulatorScreen
          import com.infinix.retroemu.ui.LibraryScreen
          import kotlinx.coroutines.launch
          import java.io.File
          import java.io.FileOutputStream

          class MainActivity : ComponentActivity() {
              private lateinit var romScanner: RomScanner
              private val activeRomState = mutableStateOf<RomItem?>(null)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  romScanner = RomScanner(this)
                  extractBundledCores()

                  setContent {
                      val romList = remember { mutableStateOf<List<RomItem>>(emptyList()) }
                      val lastPlayed = remember { mutableStateOf<RomItem?>(null) }
                      val currentRom = activeRomState.value

                      LaunchedEffect(Unit) {
                          val prefs = getSharedPreferences("retro_prefs", Context.MODE_PRIVATE)
                          prefs.getString("saved_folder_uri", null)?.let { uriStr ->
                              romList.value = romScanner.scanDirectory(Uri.parse(uriStr))
                              val lastId = prefs.getString("last_played_id", null)
                              lastPlayed.value = romList.value.find { it.id == lastId }
                          }
                      }

                      if (currentRom == null) {
                          requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED
                          showSystemBars(true)
                          LibraryScreen(
                              roms = romList.value,
                              lastPlayedRom = lastPlayed.value,
                              onSelectFolder = { uri ->
                                  contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                  getSharedPreferences("retro_prefs", Context.MODE_PRIVATE).edit().putString("saved_folder_uri", uri.toString()).apply()
                                  lifecycleScope.launch { romList.value = romScanner.scanDirectory(uri) }
                              },
                              onLaunchGame = { rom, _ ->
                                  lifecycleScope.launch {
                                      val readyRomPath = romScanner.prepareRomForExecution(rom)
                                      val corePath = getCorePathForSystem(rom.system)
                                      if (LibretroWrapper.loadCoreAndGame(corePath, readyRomPath)) {
                                          getSharedPreferences("retro_prefs", Context.MODE_PRIVATE).edit().putString("last_played_id", rom.id).apply()
                                          lastPlayed.value = rom
                                          activeRomState.value = rom
                                      }
                                  }
                              }
                          )
                      } else {
                          requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                          showSystemBars(false)
                          BackHandler { activeRomState.value = null }
                          EmulatorScreen(system = currentRom.system, romTitle = currentRom.title)
                      }
                  }
              }

              private fun extractBundledCores() {
                  val coresDir = File(filesDir, "cores").apply { mkdirs() }
                  listOf("fceumm_libretro_android.so", "gambatte_libretro_android.so", "mgba_libretro_android.so").forEach { fileName ->
                      val targetFile = File(coresDir, fileName)
                      if (!targetFile.exists()) {
                          runCatching { assets.open("cores/" + fileName).use { input -> FileOutputStream(targetFile).use { output -> input.copyTo(output) } } }
                      }
                  }
              }

              private fun getCorePathForSystem(system: ConsoleSystem): String {
                  val coreName = when (system) {
                      ConsoleSystem.NES -> "fceumm_libretro_android.so"
                      ConsoleSystem.GB_GBC -> "gambatte_libretro_android.so"
                      ConsoleSystem.GBA -> "mgba_libretro_android.so"
                  }
                 return File(File(filesDir, "cores"), coreName).absolutePath
              }

              private fun showSystemBars(show: Boolean) {
                  val controller = WindowCompat.getInsetsController(window, window.decorView)
                  if (show) controller.show(WindowInsetsCompat.Type.systemBars())
                  else {
                      controller.hide(WindowInsetsCompat.Type.systemBars())
                      controller.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
              }
          }
          """)

          print("Proyecto escrito con puente nativo real")

      - name: Descargar Gradle 8.5, Nucleos Libretro y Compilar APK
        run: |
          mkdir -p app/src/main/assets/cores
          cd app/src/main/assets/cores
          curl -sL https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/fceumm_libretro_android.so.zip -o nes.zip && unzip -q nes.zip && rm nes.zip
          curl -sL https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/gambatte_libretro_android.so.zip -o gb.zip && unzip -q gb.zip && rm gb.zip
          curl -sL https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/mgba_libretro_android.so.zip -o gba.zip && unzip -q gba.zip && rm gba.zip
          cd ../../../..
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
          unzip -q gradle.zip
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          ./gradle-8.5/bin/gradle assembleDebug --no-daemon

      - name: Subir APK Definitivo
        uses: actions/upload-artifact@v4
        with:
          name: Infinix-RetroEmu-APK
          path: app/build/outputs/apk/debug/app-debug.apk
