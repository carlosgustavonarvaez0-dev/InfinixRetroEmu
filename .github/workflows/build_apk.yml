name: Compilar APK Infinix

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Crear estructura y descargar nucleos
        run: |
          mkdir -p app/src/main/assets/cores
          cd app/src/main/assets/cores
          wget -q https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/fceumm_libretro_android.so.zip
          unzip -q fceumm_libretro_android.so.zip && rm fceumm_libretro_android.so.zip
          wget -q https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/gambatte_libretro_android.so.zip
          unzip -q gambatte_libretro_android.so.zip && rm gambatte_libretro_android.so.zip
          wget -q https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/mgba_libretro_android.so.zip
          unzip -q mgba_libretro_android.so.zip && rm mgba_libretro_android.so.zip

      - name: Compilar con Gradle
        run: |
          chmod +x gradlew || true
          gradle assembleDebug || ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Infinix-RetroEmu-APK
          path: app/build/outputs/apk/debug/app-debug.apk
